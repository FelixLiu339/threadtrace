<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Package Room</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b10;--panel:#0e141c;--panel2:#121a24;--line:#1d2834;--text:#e9eff6;--muted:#9aa9ba;--dim:#6b7b8f;
  --accent:#38bdf8;--accent-rgb:56,189,248;--green:#22c55e;--amber:#f5a524;--red:#f87171;
  --font:'Atkinson Hyperlegible','Inter',system-ui,sans-serif;--num:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.5;overflow:hidden}
button,select{font:inherit;color:inherit}
.stage{position:absolute;inset:0;display:grid;place-items:center}
svg.room{width:100%;height:100%;display:block}
.box{cursor:pointer}
.box .lift{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.box:hover .lift,.box.sel .lift{transform:translateY(-8px)}
.box .glow{opacity:0;transition:opacity .25s}
.box:hover .glow,.box.sel .glow{opacity:1}
.box.seen .dot{fill:var(--green)}
.box.pulse .lift{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 18px rgba(var(--accent-rgb),.9))}}
/* top bar */
.bar{position:absolute;top:16px;left:20px;right:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:3;pointer-events:none}
.bar>*{pointer-events:auto}
.chip{background:rgba(14,20,28,.82);border:1px solid var(--line);border-radius:999px;padding:8px 16px;backdrop-filter:blur(8px);display:flex;gap:10px;align-items:center}
.chip b{font-family:var(--num);font-weight:800}
.chip select{background:transparent;border:0;color:var(--accent);font-weight:700;max-width:46vw;cursor:pointer}
.chip select option{background:#0e141c;color:var(--text)}
.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:16px;background:rgba(14,20,28,.8);border:1px solid var(--line);border-radius:999px;padding:8px 18px;z-index:2;white-space:nowrap}
/* side panel */
.panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:rgba(10,15,21,.97);border-left:1px solid var(--line);z-index:4;
  transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:22px 24px 28px;display:flex;flex-direction:column;gap:16px}
.panel.open{transform:none}
.panel>*{flex:none}
.p-top{display:flex;align-items:center;gap:10px}
.p-top .pos{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.5px}
.p-top button{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
h2{font-family:var(--num);font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1}
.sub{color:var(--muted);font-size:16px;margin-top:4px}
.openbox{background:radial-gradient(ellipse at 50% 70%,#132233,#0b1118 70%);border:1px solid var(--line);border-radius:18px;height:210px;display:grid;place-items:center;overflow:hidden}
.openbox svg{width:280px;height:200px}
.flapL,.flapR{transform-box:fill-box;transition:transform .9s cubic-bezier(.3,1.4,.4,1) .15s}
.flapL{transform-origin:right bottom}.flapR{transform-origin:left bottom}
.opened .flapL{transform:rotate(-125deg)}.opened .flapR{transform:rotate(125deg)}
.garm{transition:transform 1s cubic-bezier(.2,.8,.2,1) .55s}
.opened .garm{transform:translateY(-78px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:16px}
.kv span{color:var(--muted)} .kv b{font-weight:700}
.tag{font-family:var(--mono);font-size:11px;border:1px solid #6b2a73;color:#f0abfc;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.money{font-family:var(--num);font-weight:800;background:linear-gradient(180deg,#fff3c4,#f6c343 55%,#e09b1c);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.saved{display:flex;align-items:baseline;gap:10px;background:linear-gradient(90deg,rgba(246,195,67,.10),transparent);border:1px solid rgba(246,195,67,.35);border-radius:14px;padding:12px 16px}
.saved .money{font-size:34px;letter-spacing:-1px}
.saved span{color:var(--muted);font-size:15px}
.qrrow{display:flex;gap:16px;align-items:center}
.qr{background:#fff;border-radius:14px;padding:10px;width:132px;height:132px;display:grid;place-items:center;flex:none}
.qrrow p{color:var(--muted);font-size:15px} .qrrow p b{color:var(--text)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;font-size:17px;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04121b;font-size:19px;padding:16px}
.btn:hover{filter:brightness(1.12)}
.row2{display:flex;gap:10px}
.hist{list-style:none;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
/* phone scan */
.phone{position:absolute;z-index:6;width:200px;height:400px;border-radius:34px;background:#0b0f14;border:3px solid #2a3542;box-shadow:0 30px 80px rgba(0,0,0,.7);padding:14px;
  left:50%;top:50%;transform:translate(-50%,120vh) rotate(-8deg);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.phone.in{transform:translate(-50%,-50%) rotate(-4deg)}
.screen{position:relative;height:100%;border-radius:22px;overflow:hidden;background:#1a232e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.screen .cam{background:#fff;padding:8px;border-radius:10px;position:relative}
.screen .laser{position:absolute;left:-6px;right:-6px;height:3px;background:#ff3b3b;box-shadow:0 0 12px #ff3b3b;top:0;animation:laser 1s ease-in-out infinite alternate}
@keyframes laser{to{top:calc(100% - 3px)}}
.screen .corner{position:absolute;inset:-10px;border:3px solid rgba(255,255,255,.85);border-radius:14px;clip-path:polygon(0 0,25% 0,25% 4%,4% 4%,4% 25%,0 25%,0 75%,4% 75%,4% 96%,25% 96%,25% 100%,75% 100%,75% 96%,96% 96%,96% 75%,100% 75%,100% 25%,96% 25%,96% 4%,75% 4%,75% 0,100% 0,100% 100%,0 100%)}
.screen .msg{font-size:14px;color:#cbd5e1;text-align:center;padding:0 10px}
.screen .ok{position:absolute;inset:0;background:rgba(10,40,24,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;transition:opacity .3s;text-align:center;padding:14px}
.screen .ok.show{opacity:1}
.screen .ok i{font-style:normal;width:64px;height:64px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:34px;color:#04121b}
.screen .ok b{font-size:17px} .screen .ok span{font-size:13px;color:#bbf7d0}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:70px;height:18px;background:#0b0f14;border-radius:0 0 12px 12px;z-index:2}
@media (max-width:760px){.panel{top:auto;height:72%;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(105%);border-radius:20px 20px 0 0}.panel.open{transform:none}.hint{display:none}h2{font-size:28px}}
</style>
</head>
<body>
<div class="stage"><svg class="room" id="room" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg></div>
<div class="bar">
  <div class="chip">📍 You are in <select id="loc" aria-label="Where this room is"></select></div>
  <div class="chip" id="custChip"></div>
</div>
<div class="hint" id="hint">Tap a box to open it · each box is one package with one QR</div>
<aside class="panel" id="panel" aria-live="polite"></aside>
<div class="phone" id="phone"><div class="notch"></div><div class="screen" id="screen"></div></div>
<script>
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const PARENT = (() => { try { return parent !== window && parent.S && parent.S.data ? parent : null; } catch(e){ return null; } })();
const GATEWAY = /^https?:/.test(location.protocol) && !(PARENT && PARENT.GATEWAY_QR === false);
let D = null, CUST = null, LOTS = [], SEL = null, standaloneEvents = [];
const fmt = (v,d=0) => (+v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---- garment silhouettes (100×100) ---- */
const SHAPES = {
  'Jackets':      {fill:'#5b7088', d:'M30 18 L42 12 Q50 19 58 12 L70 18 L88 42 L79 49 L72 41 L72 90 L28 90 L28 41 L21 49 L12 42 Z', extra:'<path d="M50 20 V90" stroke="#2c3a4a" stroke-width="2"/>'},
  'Trousers':     {fill:'#475a73', d:'M30 8 H70 L75 92 H56 L50 38 L44 92 H25 Z', extra:'<path d="M30 15 H70" stroke="#2c3a4a" stroke-width="2"/>'},
  'Hi-Vis':       {fill:'#e2ef3f', d:'M30 18 L42 12 Q50 19 58 12 L70 18 L88 42 L79 49 L72 41 L72 90 L28 90 L28 41 L21 49 L12 42 Z', extra:'<path d="M28 60 H72 M28 74 H72" stroke="#cfd8e3" stroke-width="5"/><path d="M50 20 V90" stroke="#9aa52a" stroke-width="2"/>'},
  'Food Industry':{fill:'#e8edf2', d:'M32 10 L44 6 Q50 13 56 6 L68 10 L86 36 L78 43 L72 35 L74 95 L26 95 L28 35 L22 43 L14 36 Z', extra:'<circle cx="50" cy="32" r="1.8" fill="#9aa9ba"/><circle cx="50" cy="48" r="1.8" fill="#9aa9ba"/><circle cx="50" cy="64" r="1.8" fill="#9aa9ba"/>'},
  'Healthcare':   {fill:'#6cc4d8', d:'M30 14 L42 10 Q50 22 58 10 L70 14 L83 29 L72 36 L70 31 L70 82 L30 82 L30 31 L28 36 L17 29 Z', extra:'<path d="M36 50 H46 V62 H36 Z" fill="none" stroke="#3d8fa3" stroke-width="2"/>'},
  'Coveralls':    {fill:'#4467a0', d:'M32 8 L44 5 Q50 11 56 5 L68 8 L84 32 L76 39 L70 31 L70 56 L72 95 H55 L50 62 L45 95 H28 L30 56 L30 31 L24 39 L16 32 Z', extra:'<path d="M30 52 H70" stroke="#2c4570" stroke-width="3"/>'}
};
const shape = g => SHAPES[g] || SHAPES['Jackets'];
const shapeSvg = (g, x, y, s) => { const sh = shape(g); return `<g transform="translate(${x} ${y}) scale(${s/100})"><path d="${sh.d}" fill="${sh.fill}" stroke="rgba(0,0,0,.35)" stroke-width="2"/>${sh.extra}</g>`; };

/* ---- data ---- */
async function boot(){
  if(PARENT){ D = PARENT.S.data; CUST = PARENT.S.cust; }
  else { D = await (await fetch('data.json')).json(); CUST = new URLSearchParams(location.search).get('cust') || Object.keys(D.customers)[0];
         if(GATEWAY) try { standaloneEvents = await (await fetch('events')).json(); if(!Array.isArray(standaloneEvents)) standaloneEvents = standaloneEvents.events||[]; } catch(e){} }
  build();
}
function events(){ return PARENT ? PARENT.S.events : standaloneEvents; }
function cust(){ return D.customers[CUST]; }
function locations(){ const c = cust(); const L = [...new Set(c.sites.map(s=>s.laundry))].map(l=>[l,'Lindström laundry · '+D.laundries[l].name+' · repair room']);
  return L.concat(c.sites.map(s=>[s.id, s.name+' · garment room'])); }
function placeName(loc){ const s = cust().sites.find(x=>x.id===loc); if(s) return s.name; return D.laundries[loc]? 'Lindström laundry · '+D.laundries[loc].name : loc; }
function lotEvents(id){ return events().filter(e=>e.lot_id===id); }

function build(){
  if(PARENT){ D = PARENT.S.data; CUST = PARENT.S.cust; }
  const c = cust();
  $('#custChip').innerHTML = `📦 <b>${c.name}</b> · package room`;
  const sel = $('#loc'), prev = sel.value; sel.innerHTML = locations().map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  if(prev && [...sel.options].some(o=>o.value===prev)) sel.value = prev;
  const demo = (D.demo_lots||[]).filter(k=>D.lots[k].c===CUST);
  const rest = Object.keys(D.lots).filter(k=>D.lots[k].c===CUST && !demo.includes(k));
  LOTS = demo.concat(rest).slice(0, 18);
  drawRoom(); closePanel();
}

/* ---- the room ---- */
function drawRoom(){
  const svg = $('#room');
  const W = 1600, H = 900, bx0 = 250, bx1 = 1350, by1 = 560;   // back wall
  let s = `<defs>
   <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121c27"/><stop offset="1" stop-color="#0c131b"/></linearGradient>
   <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070b10"/><stop offset="1" stop-color="#0d151e"/></linearGradient>
   <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#070b10"/><stop offset="1" stop-color="#0d151e"/></linearGradient>
   <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1822"/><stop offset="1" stop-color="#060a0e"/></linearGradient>
   <radialGradient id="lamp" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="rgba(var(--accent-rgb),.22)"/><stop offset="1" stop-color="rgba(var(--accent-rgb),0)"/></radialGradient>
   <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a27b4f"/><stop offset="1" stop-color="#7d5c39"/></linearGradient>
   <linearGradient id="cardTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c49866"/><stop offset="1" stop-color="#a98152"/></linearGradient>
   <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="${W}" height="${H}" fill="#05080c"/>
  <rect x="${bx0}" y="0" width="${bx1-bx0}" height="${by1}" fill="url(#wall)"/>
  <polygon points="0,0 ${bx0},0 ${bx0},${by1} 0,${H}" fill="url(#side)"/>
  <polygon points="${W},0 ${bx1},0 ${bx1},${by1} ${W},${H}" fill="url(#sideR)"/>
  <polygon points="${bx0},${by1} ${bx1},${by1} ${W},${H} 0,${H}" fill="url(#floor)"/>`;
  // floor tiles in perspective
  for(let i=0;i<=10;i++){ const xb = bx0 + (bx1-bx0)*i/10, xf = W*i/10; s += `<line x1="${xb}" y1="${by1}" x2="${xf}" y2="${H}" stroke="#16212d" stroke-width="1.5"/>`; }
  for(let j=1;j<6;j++){ const t = Math.pow(j/6,1.8), y = by1 + (H-by1)*t, xl = bx0*(1-t), xr = bx1 + (W-bx1)*t; s += `<line x1="${xl}" y1="${y}" x2="${xr}" y2="${y}" stroke="#16212d" stroke-width="1.5"/>`; }
  // lamp light
  s += `<ellipse cx="800" cy="0" rx="700" ry="620" fill="url(#lamp)"/>
   <rect x="640" y="0" width="320" height="16" rx="6" fill="#1b2633"/><rect x="660" y="14" width="280" height="6" rx="3" fill="rgba(var(--accent-rgb),.7)"/>`;
  // sign + clock on back wall
  s += `<g transform="translate(560 60)"><rect width="480" height="64" rx="12" fill="#0e141c" stroke="#1d2834"/>
   <text x="240" y="41" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="24" fill="#e9eff6" letter-spacing="1">RETURN &amp; REPAIR · PACKAGES</text></g>
   <g transform="translate(1250 92)"><circle r="38" fill="#0e141c" stroke="#2a3542" stroke-width="4"/><line id="hh" x1="0" y1="0" x2="0" y2="-20" stroke="#e9eff6" stroke-width="4" stroke-linecap="round"/><line id="mh" x1="0" y1="0" x2="0" y2="-30" stroke="#9aa9ba" stroke-width="3" stroke-linecap="round"/><circle r="4" fill="var(--accent)"/></g>
   <g transform="translate(330 70)"><rect width="150" height="104" rx="6" fill="#3a2c1d" stroke="#1d2834" stroke-width="4"/>
     <rect x="14" y="12" width="40" height="50" fill="#e9eff6" transform="rotate(-4 34 37)"/><rect x="64" y="16" width="34" height="34" fill="#fcd34d" transform="rotate(5 81 33)"/><rect x="104" y="14" width="34" height="44" fill="#7dd3fc" transform="rotate(-3 121 36)"/><rect x="40" y="66" width="60" height="28" fill="#f0abfc" transform="rotate(3 70 80)"/></g>`;
  // racks
  const racks = [{x:290, label:'A'}, {x:820, label:'B'}], rw = 490, top = 190, planks = [330, 470, 610], bottom = 700;
  racks.forEach(r=>{
    s += `<text x="${r.x+rw/2}" y="${top-14}" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" fill="#6b7b8f">RACK ${r.label}</text>`;
    s += `<rect x="${r.x-8}" y="${top}" width="14" height="${bottom-top}" fill="#24303d"/><rect x="${r.x+rw-6}" y="${top}" width="14" height="${bottom-top}" fill="#24303d"/>`;
    planks.forEach(py=> s += `<rect x="${r.x-8}" y="${py}" width="${rw+14}" height="12" fill="#2f3d4d"/><rect x="${r.x-8}" y="${py+12}" width="${rw+14}" height="5" fill="#141c25"/>`);
    s += `<ellipse cx="${r.x+rw/2}" cy="${bottom+6}" rx="${rw/1.8}" ry="14" fill="#000" opacity=".45"/>`;
  });
  // laundry cart (left) and scan desk (right)
  s += `<g transform="translate(70 610)"><rect x="0" y="0" width="150" height="110" rx="10" fill="#1b2633" stroke="#2a3542" stroke-width="3"/>
     <path d="M10 6 Q40 -30 75 2 Q110 -26 140 6" fill="#3c4c5f"/><circle cx="22" cy="126" r="12" fill="#24303d"/><circle cx="128" cy="126" r="12" fill="#24303d"/>
     <text x="75" y="64" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" fill="#6b7b8f">SOILED</text></g>
   <g transform="translate(1390 600)"><rect x="0" y="0" width="190" height="20" rx="4" fill="#2f3d4d"/><rect x="12" y="20" width="10" height="120" fill="#24303d"/><rect x="168" y="20" width="10" height="120" fill="#24303d"/>
     <rect x="60" y="-46" width="70" height="46" rx="8" fill="#0e141c" stroke="rgba(var(--accent-rgb),.6)" stroke-width="2"/><text x="95" y="-17" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="var(--accent)">SCAN</text></g>`;
  // boxes
  const slots = [];
  racks.forEach(r=>planks.forEach((py,pi)=>[0,1,2].forEach(k=>slots.push({x:r.x+12+k*(rw-14)/3, py, rack:r.label, shelf:pi+1, slot:k+1}))));
  LOTS.forEach((id,i)=>{
    const sl = slots[i]; if(!sl) return; const l = D.lots[id], pr = D.products[l.p];
    const bw = 120 + Math.round(l.n/25*28), bh = 82 + Math.round(l.n/25*22), x = sl.x + (150 - bw)/2 + 4, y = sl.py - bh, seen = lotEvents(id).length>0;
    s += `<g class="box${seen?' seen':''}" data-id="${id}" data-pos="Rack ${sl.rack} · Shelf ${sl.shelf} · Slot ${sl.slot}" tabindex="0" role="button" aria-label="Package ${id}">
      <g class="lift">
       <rect class="glow" x="${x-10}" y="${y-18}" width="${bw+20}" height="${bh+26}" rx="16" fill="rgba(var(--accent-rgb),.35)" filter="url(#soft)"/>
       <polygon points="${x},${y} ${x+14},${y-12} ${x+bw+14},${y-12} ${x+bw},${y}" fill="url(#cardTop)"/>
       <polygon points="${x+bw},${y} ${x+bw+14},${y-12} ${x+bw+14},${y+bh-12} ${x+bw},${y+bh}" fill="#5f4529"/>
       <rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="url(#card)"/>
       <rect x="${x+bw/2-7}" y="${y}" width="14" height="${bh*0.35}" fill="#c9a46f" opacity=".7"/>
       <rect x="${x+12}" y="${y+bh*0.42}" width="${bw-24}" height="${bh*0.46}" rx="4" fill="#f4f1ea"/>
       ${shapeSvg(pr.group, x+16, y+bh*0.44, bh*0.42)}
       <text x="${x+20+bh*0.44}" y="${y+bh*0.62}" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="700" fill="#0b1118">${id}</text>
       <text x="${x+20+bh*0.44}" y="${y+bh*0.80}" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4a525c">${l.n} pcs</text>
       <circle class="dot" cx="${x+bw-12}" cy="${y+12}" r="5" fill="#9aa9ba"/>
      </g></g>`;
  });
  svg.innerHTML = s; svg.setAttribute('preserveAspectRatio', innerWidth < 760 ? 'xMidYMid meet' : 'xMidYMid slice');
  svg.querySelectorAll('.box').forEach(b=>{ b.onclick = () => openBox(b.dataset.id, b.dataset.pos); b.onkeydown = e => { if(e.key==='Enter') openBox(b.dataset.id, b.dataset.pos); }; });
  tick();
}
function tick(){ const d = new Date(), h = $('#hh'), m = $('#mh'); if(!h) return;
  h.setAttribute('transform', `rotate(${(d.getHours()%12+d.getMinutes()/60)*30})`); m.setAttribute('transform', `rotate(${d.getMinutes()*6})`); }
setInterval(tick, 20000);

/* ---- panel ---- */
function qrDraw(el, text, size){ const go = () => { el.innerHTML=''; new QRCode(el,{text,width:size,height:size,colorDark:'#0b1118',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); };
  if(window.QRCode) return go(); const add=(src,next)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>window.QRCode?go():next&&next(); s.onerror=()=>next&&next(); document.head.appendChild(s); };
  add('vendor/qrcode.min.js', ()=>add('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', null)); }
const lotUrl = id => GATEWAY ? location.origin + '/p/' + id : 'threadtrace:package:' + id;

function openBox(id, pos){
  SEL = {id, pos};
  document.querySelectorAll('.box').forEach(b=>b.classList.toggle('sel', b.dataset.id===id));
  const l = D.lots[id], pr = D.products[l.p], c = cust(), site = c.sites.find(s=>s.id===l.s) || {}, evs = lotEvents(id);
  const last = evs[evs.length-1], rep = evs.filter(e=>e.type==='repair').reduce((a,e)=>a+(+e.qty||1),0);
  const label = {checkin:'📍 Checked in', repair:'🔧 Repaired', writeoff:'❌ Written off', weigh:'⚖ Weighed'};
  const sh = shape(pr.group);
  $('#panel').innerHTML = `
   <div class="p-top"><span class="pos">${pos.toUpperCase()}</span><button onclick="closePanel()">Close</button></div>
   <div><h2>${id}</h2><div class="sub">${l.n} × ${pr.name}</div></div>
   <div class="openbox" id="ob"><svg viewBox="0 0 280 200">
     <rect x="60" y="80" width="160" height="16" fill="#5f4529"/>
     <g class="garm"><g transform="translate(95 92) scale(.9)"><path d="${sh.d}" fill="${sh.fill}" stroke="rgba(0,0,0,.35)" stroke-width="2"/>${sh.extra}</g></g>
     <rect x="60" y="96" width="160" height="96" fill="url(#cardB)"/>
     <defs><linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a27b4f"/><stop offset="1" stop-color="#6e5033"/></linearGradient></defs>
     <polygon class="flapL" points="60,96 140,96 130,84 70,84" fill="#c49866"/>
     <polygon class="flapR" points="140,96 220,96 210,84 150,84" fill="#b88c5c"/>
     <rect x="84" y="128" width="112" height="40" rx="5" fill="#f4f1ea"/><text x="140" y="146" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#0b1118">${id}</text>
     <text x="140" y="161" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4a525c">${l.n} × ${pr.group}</text>
   </svg></div>
   <div class="kv">
     <span>Customer</span><b>${c.name}</b>
     <span>Assigned to</span><b>${site.name||l.s}</b>
     <span>Address</span><b>${site.city||''}, ${site.country||''} · ${site.lat!=null?(+site.lat).toFixed(3)+'°N '+(+site.lon).toFixed(3)+'°E':''}</b>
     <span>Washed by</span><b>${D.laundries[site.laundry]?.name||''}</b>
     <span>Produced</span><b>${l.prod}<span class="tag">DEMO</span></b>
     <span>Delivered</span><b>${l.del}<span class="tag">DEMO</span></b>
     <span>Stored at</span><b>${$('#loc').selectedOptions[0].text.replace(' · repair room','').replace(' · garment room','')} · ${pos}</b>
     <span>Last seen</span><b>${last ? label[last.type]+' · '+placeName(last.location||last.site_id)+' · '+(last.ts||'').slice(5,16).replace('T',' ') : 'not scanned yet'}</b>
   </div>
   ${rep ? `<div class="saved"><span class="money">€${fmt(rep*pr.cost_eur)}</span><span>saved by ${rep} repair${rep===1?'':'s'} in this package · estimate</span></div>` : ''}
   <div class="qrrow"><div class="qr" id="pq"></div><p><b>One QR for ${l.n} garments.</b><br>${GATEWAY?'Scan with a real phone, or simulate it below.':'Simulate a phone scan below.'}</p></div>
   <button class="btn primary" onclick="scan('checkin')">📱 Scan this box here</button>
   <div class="row2"><button class="btn" onclick="scan('repair')">🔧 Repair 2</button><button class="btn" onclick="scan('writeoff')">❌ Write off 1</button></div>
   ${evs.length?`<ul class="hist">${evs.slice(-4).reverse().map(e=>`<li>${(e.ts||'').slice(5,16).replace('T',' ')} · ${label[e.type]||e.type}${e.qty&&e.type!=='checkin'?' '+e.qty:''} · ${placeName(e.location||e.site_id)}</li>`).join('')}</ul>`:''}`;
  $('#panel').classList.add('open'); $('#hint').style.opacity = 0;
  qrDraw($('#pq'), lotUrl(id), 112);
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('#ob').classList.add('opened')));
}
function closePanel(){ $('#panel').classList.remove('open'); $('#hint').style.opacity = 1; SEL = null; document.querySelectorAll('.box').forEach(b=>b.classList.remove('sel')); }

/* ---- simulated phone scan ---- */
function beep(){ try{ const a = new (window.AudioContext||window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 1760; g.gain.value = .06; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.12); }catch(e){} }
let busy = false;
function scan(action){
  if(!SEL || busy) return; busy = true;
  const id = SEL.id, l = D.lots[id], pr = D.products[l.p], loc = $('#loc').value, qty = action==='checkin' ? l.n : (action==='repair' ? 2 : 1);
  const detail = action==='repair' ? 'BUTTON' : (action==='writeoff' ? 'Worn out' : null);
  const box = document.querySelector(`.box[data-id="${id}"]`); box && box.classList.add('pulse');
  const scr = $('#screen');
  scr.innerHTML = `<div class="msg">Camera</div><div class="cam"><div id="phq"></div><div class="corner"></div><div class="laser"></div></div><div class="msg">Point at the package QR</div>
    <div class="ok" id="okp"><i>✓</i><b>${{checkin:'Checked in',repair:'2 repaired',writeoff:'1 written off'}[action]}</b><span>${id} · ${l.n} × ${pr.name}</span><span>📍 ${$('#loc').selectedOptions[0].text}</span>
    ${action==='repair'?`<span class="money" style="font-size:26px">€${fmt(2*pr.cost_eur)} saved</span>`:''}</div>`;
  qrDraw($('#phq'), lotUrl(id), 110);
  $('#phone').classList.add('in');
  setTimeout(()=>{ beep(); $('#okp').classList.add('show'); }, 1700);
  setTimeout(()=>{ $('#phone').classList.remove('in'); box && box.classList.remove('pulse'); }, 3200);
  setTimeout(()=>{ send(id, action, qty, detail, loc); busy = false; }, 3700);
  setTimeout(()=>{ if(SEL && SEL.id===id) openBox(id, SEL.pos); const b = document.querySelector(`.box[data-id="${id}"]`); b && b.classList.add('seen'); }, 4300);
}
function send(id, action, qty, detail, loc){
  if(PARENT && PARENT.sendLot) return PARENT.sendLot(id, action, qty, detail, loc);
  const ev = {lot_id:id, action, qty, detail, location:loc};
  if(GATEWAY) fetch('api/lot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ev)}).then(r=>r.json()).then(j=>{ if(j.event) standaloneEvents.push(j.event); }).catch(()=>{});
  else standaloneEvents.push({type:action, lot_id:id, qty, detail, location:loc, ts:new Date().toISOString()});
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });
window.build = build;
boot();
</script>
</body>
</html>
